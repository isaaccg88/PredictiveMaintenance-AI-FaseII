name: predictive-maintenance-faseii
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MODEL_PATH: /app/artifacts/risk72h_model.joblib
      SNAPSHOT_PATH: /app/artifacts/pilot_snapshot.json
      META_PATH: /app/artifacts/model_metadata.json
      DB_PATH: /state/predictions.sqlite
    volumes:
      - prediction_state:/state
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  prediction_state:
