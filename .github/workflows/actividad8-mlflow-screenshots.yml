name: Actividad 8 - Capturas auténticas de MLflow
on:
  push:
    branches: [actividad8-v2-observabilidad]
    paths:
      - '.github/workflows/actividad8-mlflow-screenshots.yml'
      - 'actividad8/mlflow_capture.py'
  workflow_dispatch:
concurrency:
  group: actividad8-mlflow-evidence
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  capture-real-mlflow-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: actividad8/requirements.txt
      - name: Preparar entorno de evaluación reproducible
        run: |
          python -m pip install -r actividad8/requirements.txt
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Crear runs medidos con MLflow
        env:
          LAB_MODE: '1'
          LAB_TOKEN: screenshot-ci
        run: |
          python -m actividad8.train_v2 --mlflow
          python -m actividad8.mlflow_audit
          nohup python -m uvicorn actividad8.service:app --host 127.0.0.1 --port 8008 > actividad8/evidence/api_server_screenshots.log 2>&1 &
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8008/health >/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1 || (cat actividad8/evidence/api_server_screenshots.log && exit 1)
          python -m actividad8.laboratory
          python -m actividad8.verify
          python -m actividad8.mlflow_incidents
          python -m actividad8.mlflow_incident_audit
      - name: Abrir UI MLflow real y tomar capturas con Chromium
        env:
          MLFLOW_UI_URL: 'http://127.0.0.1:5000'
          STREAMLIT_UI_URL: 'http://127.0.0.1:8510'
        run: |
          nohup mlflow ui --backend-store-uri ./actividad8/mlruns --host 127.0.0.1 --port 5000 > actividad8/evidence/mlflow_ui_server.log 2>&1 &
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5000/ >/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1 || (cat actividad8/evidence/mlflow_ui_server.log && exit 1)
          # Dashboard real: reutiliza el mismo servidor API e incidents.json.
          export PYTHONPATH="$PWD"
          nohup streamlit run actividad8/dashboard.py --server.headless=true --server.port=8510 > actividad8/evidence/streamlit_ui_server.log 2>&1 &
          streamlit_ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8510/_stcore/health >/dev/null; then streamlit_ready=1; break; fi
            sleep 2
          done
          test "$streamlit_ready" -eq 1 || (cat actividad8/evidence/streamlit_ui_server.log && exit 1)
          python -m actividad8.mlflow_capture
          test -s actividad8/evidence/screenshots/MLflow_experimento_runs.png
          test -s actividad8/evidence/screenshots/MLflow_modelo_v2_metricas.png
          test -s actividad8/evidence/screenshots/MLflow_incidente_latencia.png
          test -s actividad8/evidence/screenshots/MLflow_incidente_drift.png
          test -s actividad8/evidence/screenshots/Dashboard_resumen.png
          test -s actividad8/evidence/screenshots/Dashboard_monitoreo_http.png
          test -s actividad8/evidence/screenshots/Dashboard_alertas_slo.png
          test -s actividad8/evidence/screenshots/Dashboard_incidentes_runbooks.png
          test -s actividad8/evidence/screenshots/Dashboard_trazabilidad.png
      - name: Publicar capturas auténticas permanentes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # El repo puede haber avanzado durante la captura. Integrar cabeza
          # remota y reponer SOLO evidencias binarias nuevas, sin reescribir docs.
          for attempt in 1 2 3; do
            git fetch origin actividad8-v2-observabilidad
            git reset --mixed FETCH_HEAD
            git add actividad8/evidence/screenshots/MLflow_*.png actividad8/evidence/screenshots/Dashboard_*.png
            if git diff --cached --quiet; then
              echo 'Las capturas ya coinciden con el repositorio'
              exit 0
            fi
            git commit -m 'docs(actividad8): capturas auténticas MLflow y dashboard [skip ci]'
            if git push origin HEAD:actividad8-v2-observabilidad; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Conservar reporte de pantalla y log de captura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actividad8-mlflow-capturas-y-registros
          path: |
            actividad8/evidence/screenshots/MLflow_*.png
            actividad8/evidence/screenshots/Dashboard_*.png
            actividad8/evidence/mlflow_screenshots_manifest.json
            actividad8/evidence/mlflow_ui_server.log
            actividad8/evidence/streamlit_ui_server.log
          if-no-files-found: warn
          retention-days: 30
